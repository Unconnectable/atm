<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AETHER · 私人银行模拟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
/* ========== Reset & Base ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0c;
  --bg-card: rgba(26,26,30,0.82);
  --border: rgba(212,165,116,0.15);
  --border-focus: rgba(212,165,116,0.5);
  --gold: #d4a574;
  --gold-light: #e8cfa6;
  --gold-dark: #b8885a;
  --text: #f5f0eb;
  --text-dim: rgba(245,240,235,0.5);
  --text-muted: rgba(245,240,235,0.35);
  --error: #ef4455;
  --error-bg: rgba(239,68,85,0.1);
  --success: #10b981;
  --success-bg: rgba(16,185,129,0.1);
  --radius: 16px;
  --shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
  --font-serif: 'Playfair Display', Georgia, serif;
  --font-sans: 'DM Sans', system-ui, -apple-system, sans-serif;
  --transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

html, body {
  height: 100%;
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ========== Background Canvas ========== */
#bg-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
}

/* ========== Screen Container ========== */
.app {
  position: relative;
  z-index: 1;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.screen {
  display: none;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 420px;
  background: var(--bg-card);
  backdrop-filter: blur(24px) saturate(1.3);
  -webkit-backdrop-filter: blur(24px) saturate(1.3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 40px 36px 36px;
  box-shadow: var(--shadow);
  animation: screenIn 0.5s cubic-bezier(0.16,1,0.3,1) forwards;
  transform-origin: center;
}

@keyframes screenIn {
  0% { opacity: 0; transform: scale(0.94) translateY(12px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

.screen.active { display: flex; }
.screen.exit {
  display: flex;
  animation: screenOut 0.3s cubic-bezier(0.5,0,0.5,1) forwards;
  pointer-events: none;
}

@keyframes screenOut {
  0% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(0.96) translateY(8px); }
}

/* ========== Logo / Brand ========== */
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}
.brand-icon {
  width: 36px; height: 36px;
  border: 1.5px solid var(--gold);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: var(--gold);
}
.brand-name {
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: 4px;
  color: var(--gold);
  text-transform: uppercase;
}
.brand-sub {
  font-size: 13px;
  color: var(--text-dim);
  letter-spacing: 2px;
  font-weight: 300;
  margin-bottom: 28px;
}

/* ========== Typography ========== */
h1 {
  font-family: var(--font-serif);
  font-size: 26px;
  font-weight: 600;
  margin-bottom: 4px;
}
h2 {
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 500;
  margin-bottom: 20px;
  font-style: italic;
  color: var(--gold);
}

/* ========== Form Elements ========== */
.form-group {
  width: 100%;
  margin-bottom: 16px;
}
.form-group label {
  display: block;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-dim);
  margin-bottom: 6px;
  font-weight: 500;
}
.form-group input {
  width: 100%;
  padding: 14px 16px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 15px;
  font-family: var(--font-sans);
  outline: none;
  transition: var(--transition);
}
.form-group input:focus {
  border-color: var(--border-focus);
  background: rgba(255,255,255,0.07);
  box-shadow: 0 0 0 3px rgba(212,165,116,0.08);
}
.form-group input::placeholder {
  color: var(--text-muted);
}

/* ========== Buttons ========== */
.btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 500;
  font-family: var(--font-sans);
  cursor: pointer;
  transition: var(--transition);
  letter-spacing: 0.3px;
}
.btn-primary {
  background: linear-gradient(135deg, var(--gold-dark), var(--gold));
  color: #0a0a0c;
  font-weight: 600;
}
.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 24px rgba(212,165,116,0.25);
}
.btn-primary:active {
  transform: translateY(0);
}
.btn-ghost {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--border);
  margin-top: 8px;
}
.btn-ghost:hover {
  border-color: rgba(212,165,116,0.3);
  color: var(--text);
}
.btn-danger {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid rgba(239,68,85,0.2);
  margin-top: 8px;
}
.btn-danger:hover {
  border-color: rgba(239,68,85,0.4);
  color: var(--error);
}

/* ========== Inline Message ========== */
.msg {
  width: 100%;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 13px;
  margin-bottom: 16px;
  display: none;
  text-align: center;
  animation: msgIn 0.35s ease;
}
.msg.show { display: block; }
.msg.error {
  background: var(--error-bg);
  color: var(--error);
  border: 1px solid rgba(239,68,85,0.15);
}
.msg.success {
  background: var(--success-bg);
  color: var(--success);
  border: 1px solid rgba(16,185,129,0.15);
}

@keyframes msgIn {
  0% { opacity: 0; transform: translateY(-6px); }
  100% { opacity: 1; transform: translateY(0); }
}

/* ========== Menu Grid ========== */
.menu-grid {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 8px;
}
.menu-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 22px 12px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 12px;
  cursor: pointer;
  transition: var(--transition);
  font-family: var(--font-sans);
  font-size: 14px;
  color: var(--text);
  text-decoration: none;
  -webkit-appearance: none;
}
.menu-item:hover {
  background: rgba(212,165,116,0.08);
  border-color: rgba(212,165,116,0.3);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.menu-item:active {
  transform: translateY(0);
}
.menu-item .icon {
  font-size: 26px;
  line-height: 1;
}
.menu-item .label {
  font-weight: 500;
  font-size: 13px;
  letter-spacing: 0.5px;
}
.menu-item.full {
  grid-column: 1 / -1;
}

/* ========== Balance Display ========== */
.balance-amount {
  font-family: var(--font-serif);
  font-size: 40px;
  font-weight: 600;
  color: var(--gold);
  letter-spacing: 2px;
  margin: 16px 0 8px;
  text-shadow: 0 0 40px rgba(212,165,116,0.1);
}
.balance-label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--text-dim);
  margin-bottom: 24px;
}

/* ========== Password Strength Meter ========== */
.pwd-hint {
  width: 100%;
  font-size: 12px;
  color: var(--text-dim);
  margin-top: -10px;
  margin-bottom: 16px;
  padding-left: 4px;
}

/* ========== Welcome Header ========== */
.welcome-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.welcome-head .greeting {
  font-size: 14px;
  color: var(--text-dim);
}
.welcome-head .acc {
  font-family: var(--font-serif);
  font-size: 15px;
  color: var(--gold);
  font-style: italic;
}

/* ========== Language Toggle ========== */
.lang-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-family: var(--font-sans);
  transition: var(--transition);
  letter-spacing: 0.5px;
  line-height: 1.4;
}
.lang-btn:hover {
  border-color: var(--gold);
  color: var(--gold);
}

/* ========== History List ========== */
.history-list {
  width: 100%;
  max-height: 290px;
  overflow-y: auto;
  background: rgba(0,0,0,0.25);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px 4px;
  margin-bottom: 16px;
}
.history-list::-webkit-scrollbar {
  width: 4px;
}
.history-list::-webkit-scrollbar-track {
  background: transparent;
}
.history-list::-webkit-scrollbar-thumb {
  background: var(--gold-dark);
  border-radius: 2px;
}
.history-item {
  padding: 9px 12px;
  font-family: 'Courier New', Courier, monospace;
  font-size: 12px;
  color: var(--text-dim);
  border-bottom: 1px solid rgba(255,255,255,0.04);
  line-height: 1.7;
  letter-spacing: 0.2px;
  white-space: nowrap;
}
.history-item:last-child {
  border-bottom: none;
}
.history-item .tx-time {
  color: var(--text-muted);
}
.history-item .tx-type {
  color: var(--gold-light);
  font-weight: 500;
}
.history-item .tx-amount {
  font-weight: 600;
}
.tx-positive { color: var(--success) !important; }
.tx-negative { color: var(--error) !important; }
.history-empty {
  text-align: center;
  padding: 40px 16px;
  color: var(--text-muted);
  font-size: 13px;
  font-family: var(--font-sans);
}

/* ========== Responsive ========== */
@media (max-width: 480px) {
  .app { padding: 12px; }
  .screen { padding: 28px 20px 24px; border-radius: 14px; }
  .balance-amount { font-size: 32px; }
  .menu-grid { gap: 10px; }
  .menu-item { padding: 18px 10px; }
  .brand-name { font-size: 18px; letter-spacing: 3px; }
  .history-item { font-size: 11px; padding: 7px 10px; }
}
</style>
</head>
<body>

<!-- ========== Background Canvas ========== -->
<canvas id="bg-canvas"></canvas>

<!-- ========== App Container ========== -->
<div class="app" id="app">

  <!-- ===== Login ===== -->
  <div class="screen active" id="screen-login">
    <div class="brand">
      <div class="brand-icon">✦</div>
      <span class="brand-name">AETHER</span>
    </div>

    <div class="form-group">
      <label data-i18n="login.account.label">账号</label>

  <!-- ===== Menu ===== -->

        <span class="label" data-i18n="menu.deposit">存款业务</span>

      <button class="menu-item" data-action="withdraw">

  <!-- ===== Balance ===== -->

    <p class="pwd-hint" data-i18n="transfer.hint">限转 100 的倍数，单笔不超过 ¥5,000</p>

    <button class="btn btn-ghost" id="pwd-back" data-i18n="btn.back">返回主菜单</button>
  </div>

</div>

<script>
// ========================================================================
//  Background Canvas – Floating Orbs
// ========================================================================
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

class Orb {
  constructor() { this.reset(); }
  reset() {
    this.r = 80 + Math.random() * 200;
    this.x = Math.random() * (W + this.r * 2) - this.r;
    this.y = Math.random() * (H + this.r * 2) - this.r;
    this.vx = (Math.random() - 0.5) * 0.25;
    this.vy = (Math.random() - 0.5) * 0.25;
    this.alpha = 0.015 + Math.random() * 0.025;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    if (this.x < -this.r * 2 || this.x > W + this.r * 2 ||
        this.y < -this.r * 2 || this.y > H + this.r * 2) this.reset();
  }
  draw() {
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r);
    grad.addColorStop(0, `rgba(212,165,116,${this.alpha})`);
    grad.addColorStop(0.4, `rgba(180,140,100,${this.alpha * 0.5})`);
    grad.addColorStop(1, 'rgba(212,165,116,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill();
  }
}

const orbs = Array.from({ length: 6 }, () => new Orb());

function drawBg() {
  ctx.clearRect(0, 0, W, H);
  orbs.forEach(o => { o.update(); o.draw(); });
  requestAnimationFrame(drawBg);
}
drawBg();

// ========================================================================
//  ATM Model (localStorage) — Multi-account, Transactions, Lockout
// ========================================================================
const STORAGE_KEY = 'aether_atm';

const defaultData = {
  users: [
    {
      account: '123456',
      password: '123456',
      balance: 10000.0,
      failed_attempts: 0,
      locked_until: null
    }
  ],
  transactions: [],
  next_account: 123457
};

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      // Migrate old single-user format: {account, password, balance}
      if (d && typeof d.account === 'string' && !d.users) {
        const newData = {
          users: [{
            account: d.account,
            password: d.password,
            balance: typeof d.balance === 'number' ? d.balance : 10000.0,
            failed_attempts: 0,
            locked_until: null
          }],
          transactions: [],
          next_account: 123457
        };
        saveData(newData);
        return newData;
      }
      // New format
      if (d && d.users && Array.isArray(d.users)) {
        // Ensure each user has required fields
        d.users = d.users.map(u => ({
          account: u.account,
          password: u.password,
          balance: typeof u.balance === 'number' ? u.balance : 0,
          failed_attempts: u.failed_attempts || 0,
          locked_until: u.locked_until || null
        }));
        d.transactions = d.transactions || [];
        d.next_account = d.next_account || 123457;
        return d;
      }
    }
  } catch (_) { /* ignore */ }
  saveData(defaultData);
  return JSON.parse(JSON.stringify(defaultData));
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function _(key, replacements) {
  const lang = STRINGS[currentLang];
  const fallback = STRINGS['zh'];
  let str = (lang && lang[key]) || (fallback && fallback[key]) || key;
  if (replacements) {
    for (const [k, v] of Object.entries(replacements)) {
      str = str.replace(new RegExp('\\{' + k + '\\}', 'g'), v);
    }
  }
  return str;
}

function applyLanguage() {
  // Update all static text via data-i18n
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (key) el.textContent = _(key);
  });
  // Update all placeholders via data-i18n-placeholder
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.dataset.i18nPlaceholder;
    if (key) el.placeholder = _(key);
  });
  // Language toggle button shows the other option
  const langBtn = document.getElementById('lang-toggle');
  if (langBtn) langBtn.textContent = currentLang === 'zh' ? 'English' : '中文';
  // Re-apply account display if logged in
  if (currentAccount) {
    const accEl = document.getElementById('menu-acc');
    if (accEl) accEl.textContent = _('menu.account_label') + ' ' + currentAccount;
  }
}

let currentScreen = 'login';

function showScreen(id) {
  const currentEl = document.getElementById('screen-' + currentScreen);
  const nextEl = document.getElementById('screen-' + id);
  if (!currentEl || !nextEl) return;

  // Exit animation on current
  if (currentEl !== nextEl) {
    currentEl.classList.remove('active');
    currentEl.classList.add('exit');
    setTimeout(() => { currentEl.classList.remove('exit'); }, 350);
  }

  nextEl.classList.add('active');
  currentScreen = id;

  // Apply language to the newly shown screen
  applyLanguage();

  // Focus first input in the new screen
  const firstInput = nextEl.querySelector('input');
  if (firstInput) setTimeout(() => firstInput.focus(), 100);
}

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.className = 'msg show ' + type;
}

function clearMsg(id) {
  const el = document.getElementById(id);
  if (el) { el.className = 'msg'; el.textContent = ''; }
}

// ========================================================================
//  Helpers – User lookup
// ========================================================================
function findUser(account) {
  for (const u of data.users) {
    if (u.account === account) return u;
  }
  return null;
}

function getCurrentUser() {
  if (!currentAccount) return null;
  return findUser(currentAccount);
}

function getNextAccount() {
  const num = data.next_account || 123457;
  data.next_account = num + 1;
  saveData(data);
  return String(num);
}

document.getElementById('login-btn').addEventListener('click', () => {
  clearMsg('login-msg');
  const acc = document.getElementById('login-acc').value.trim();
  const pwd = document.getElementById('login-pwd').value;

  if (!acc || !pwd) {
    showMsg('login-msg', _('login.error.empty'), 'error');
    return;
  }

  data = loadData();
  const user = findUser(acc);
  if (!user) {
    showMsg('login-msg', _('login.error.invalid'), 'error');
    return;
  }

  // Check lockout
  if (user.locked_until) {
    const remaining = user.locked_until - Math.floor(Date.now() / 1000);
    if (remaining > 0) {
      const mins = Math.ceil(remaining / 60);
      showMsg('login-msg', _('login.error.locked', { minutes: mins }), 'error');
      return;
    } else {
      // Lock expired
      user.locked_until = null;
      user.failed_attempts = 0;
      saveData(data);
    }
  }

  if (pwd === user.password) {
    user.failed_attempts = 0;
    currentAccount = acc;
    saveData(data);
    document.getElementById('menu-acc').textContent = _('menu.account_label') + ' ' + currentAccount;
    applyLanguage();
    showScreen('menu');
  } else {
    user.failed_attempts = (user.failed_attempts || 0) + 1;
    if (user.failed_attempts >= 3) {
      user.locked_until = Math.floor(Date.now() / 1000) + 180; // 3 minutes
      saveData(data);
      showMsg('login-msg', _('login.error.locked', { minutes: 3 }), 'error');
    } else {
      saveData(data);
      showMsg('login-msg', _('login.error.invalid'), 'error');
    }
  }
});

document.getElementById('register-submit').addEventListener('click', () => {
  clearMsg('register-msg');
  data = loadData();

  const acc = document.getElementById('register-acc').value.trim();
  const pwd = document.getElementById('register-pwd').value;
  const confirmPwd = document.getElementById('register-confirm').value;

  // Validation
  if (!acc || acc.length < 4) {
    showMsg('register-msg', _('register.error.short.account'), 'error');
    return;
  }
  if (!/^[a-zA-Z0-9]+$/.test(acc)) {
    showMsg('register-msg', _('register.error.invalid.account'), 'error');
    return;
  }
  if (findUser(acc)) {
    showMsg('register-msg', _('register.error.exists'), 'error');
    return;
  }
  if (!pwd || pwd.length < 6) {
    showMsg('register-msg', _('register.error.short.pwd'), 'error');
    return;
  }
  if (pwd !== confirmPwd) {
    showMsg('register-msg', _('register.error.mismatch'), 'error');
    return;
  }

  // Create user
  data.users.push({
    account: acc,
    password: pwd,
    balance: 0.0,
    failed_attempts: 0,
    locked_until: null
  });
  saveData(data);

  // Auto-login
  currentAccount = acc;
  document.getElementById('menu-acc').textContent = _('menu.account_label') + ' ' + currentAccount;
  showMsg('register-msg', _('register.success'), 'success');
  applyLanguage();
  showScreen('menu');
});

  if (!user) { logout(); return; }

  if (amount % 100 !== 0) {
    showMsg('withdraw-msg', _('withdraw.error.multiple'), 'error');

  if (amount > 5000) {
    showMsg('withdraw-msg', _('withdraw.error.max'), 'error');
    return;
  }
  if (amount > user.balance) {
    showMsg('withdraw-msg', _('withdraw.error.insufficient'), 'error');
    return;
  }

  user.balance -= amount;
  logTransaction('withdraw', amount, user.balance);
  saveData(data);
  showMsg('withdraw-msg', _('withdraw.success', { balance: user.balance.toFixed(2) }), 'success');
  input.value = '';

  setTimeout(() => showScreen('menu'), 1200);
});

document.getElementById('transfer-submit').addEventListener('click', () => {
  clearMsg('transfer-msg');
  data = loadData();
  const user = getCurrentUser();
  if (!user) { logout(); return; }

  const targetInput = document.getElementById('transfer-target');
  const amountInput = document.getElementById('transfer-amount');
  const targetAccount = targetInput.value.trim();
  const amount = parseInt(amountInput.value, 10);

  if (!targetAccount) {
    showMsg('transfer-msg', _('transfer.error.notfound'), 'error');
    return;
  }
  if (targetAccount === user.account) {
    showMsg('transfer-msg', _('transfer.error.self'), 'error');
    return;
  }
  if (isNaN(amount) || amount <= 0) {
    showMsg('transfer-msg', _('transfer.error.invalid'), 'error');
    return;
  }
  if (amount % 100 !== 0) {
    showMsg('transfer-msg', _('transfer.error.multiple'), 'error');
    return;
  }
  if (amount > 5000) {
    showMsg('transfer-msg', _('transfer.error.max'), 'error');
    return;
  }
  if (amount > user.balance) {
    showMsg('transfer-msg', _('transfer.error.insufficient'), 'error');
    return;
  }

  const target = findUser(targetAccount);
  if (!target) {
    showMsg('transfer-msg', _('transfer.error.notfound'), 'error');
    return;
  }

  // Execute transfer
  user.balance -= amount;
  target.balance += amount;
  logTransaction('transfer_out', amount, user.balance, targetAccount);
  logTransactionFor(targetAccount, 'transfer_in', amount, target.balance, user.account);
  saveData(data);
  showMsg('transfer-msg', _('transfer.success', { balance: user.balance.toFixed(2) }), 'success');
  targetInput.value = '';
  amountInput.value = '';

  setTimeout(() => showScreen('menu'), 1200);
});

function showHistory() {
  data = loadData();
  const user = getCurrentUser();
  if (!user) { logout(); return; }

  const container = document.getElementById('history-list');
  container.innerHTML = '';

  // Get current user's transactions, sorted newest first, limit 50
  const txns = data.transactions
    .filter(t => t.account === currentAccount)
    .sort((a, b) => {
      // Sort by timestamp descending (most recent first)
      return b.timestamp.localeCompare(a.timestamp);
    })
    .slice(0, 50);

  if (txns.length === 0) {
    container.innerHTML = '<div class="history-empty" data-i18n="history.empty">' +
      _('history.empty') + '</div>';
    return;
  }

  txns.forEach(tx => {
    const typeStr = _('history.type.' + tx.type);
    const isPositive = tx.type === 'deposit' || tx.type === 'transfer_in';
    const displayAmount = isPositive ? '+' + tx.amount.toFixed(2) : '-' + tx.amount.toFixed(2);
    const amountClass = isPositive ? 'tx-positive' : 'tx-negative';

    let targetStr = '';
    if (tx.target) {
      if (tx.type === 'transfer_out') {
        targetStr = '  → ' + _('history.to') + ' ' + tx.target;
      } else if (tx.type === 'transfer_in') {
        targetStr = '  ← ' + _('history.from') + ' ' + tx.target;
      }
    }

    const div = document.createElement('div');
    div.className = 'history-item';
    div.innerHTML =
      '<span class="tx-time">' + tx.timestamp + '</span>  ' +
      '<span class="tx-type">' + typeStr + '</span>  ' +
      '<span class="tx-amount ' + amountClass + '">' + displayAmount + '</span>' +
      '  ' + _('history.balance') + ': ' + tx.balance_after.toFixed(2) +
      targetStr;
    container.appendChild(div);
  });

  showScreen('history');
}

document.getElementById('history-back').addEventListener('click', () => showScreen('menu'));

// ========================================================================
//  Transaction Logging
// ========================================================================
function logTransaction(txType, amount, balanceAfter, target) {
  const now = new Date();
  const timestamp = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0') + ' ' +
    String(now.getHours()).padStart(2, '0') + ':' +
    String(now.getMinutes()).padStart(2, '0') + ':' +
    String(now.getSeconds()).padStart(2, '0');

  data.transactions.push({
    account: currentAccount,
    type: txType,
    amount: amount,
    target: target || null,
    balance_after: balanceAfter,
    timestamp: timestamp
  });
}

function logTransactionFor(account, txType, amount, balanceAfter, source) {
  const now = new Date();
  const timestamp = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0') + ' ' +
    String(now.getHours()).padStart(2, '0') + ':' +
    String(now.getMinutes()).padStart(2, '0') + ':' +
    String(now.getSeconds()).padStart(2, '0');

  data.transactions.push({
    account: account,
    type: txType,
    amount: amount,
    target: source || null,
    balance_after: balanceAfter,
    timestamp: timestamp
  });
}

// ========================================================================
//  Controller – Change Password
// ========================================================================
document.getElementById('pwd-submit').addEventListener('click', () => {
  clearMsg('pwd-msg');
  data = loadData();
  const user = getCurrentUser();
  if (!user) { logout(); return; }

  const oldPwd = document.getElementById('pwd-old').value;
  const newPwd = document.getElementById('pwd-new').value;
  const confirmPwd = document.getElementById('pwd-confirm').value;

  if (oldPwd !== user.password) {
    showMsg('pwd-msg', _('pwd.error.old'), 'error'); return;
  }
  if (newPwd !== confirmPwd) {
    showMsg('pwd-msg', _('pwd.error.mismatch'), 'error'); return;
  }
  if (newPwd.length < 6) {
    showMsg('pwd-msg', _('pwd.error.short'), 'error'); return;
  }
  if (new Set(newPwd).size === 1) {
    showMsg('pwd-msg', _('pwd.error.same'), 'error'); return;
  }

  user.password = newPwd;
  saveData(data);
  showMsg('pwd-msg', _('pwd.success'), 'success');

  setTimeout(() => {
    document.getElementById('pwd-old').value = '';
    document.getElementById('pwd-new').value = '';
    document.getElementById('pwd-confirm').value = '';
    logout();
  }, 1400);
});

document.getElementById('pwd-back').addEventListener('click', () => showScreen('menu'));

// ========================================================================
//  Keyboard – Enter to submit on any screen
// ========================================================================
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const active = document.querySelector('.screen.active');
  if (!active) return;
  const submitBtn = active.querySelector('.btn-primary');
  if (submitBtn && submitBtn.id !== 'login-btn') submitBtn.click();
});
